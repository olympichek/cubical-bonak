name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Agda nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Locate Cabal cache directories
        id: cabal-paths
        run: |
          cabal_store=$(cabal path -v0 --store-dir)
          cabal_packages=$(cabal path -v0 --remote-repo-cache)
          echo "store=$cabal_store" >> "$GITHUB_OUTPUT"
          echo "packages=$cabal_packages" >> "$GITHUB_OUTPUT"

      - name: Restore Cabal packages
        id: cabal-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cabal-paths.outputs.packages }}
            ${{ steps.cabal-paths.outputs.store }}
          key: ${{ runner.os }}-${{ runner.arch }}-cabal-${{ hashFiles('Makefile', '.github/workflows/build.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cabal-${{ hashFiles('Makefile', '.github/workflows/build.yml') }}-

      # The Ubuntu runner includes GHCup; Make selects GHC and Cabal.
      - name: Install Agda
        run: |
          make install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Preserve the toolchain even when a later Bonak check fails.
      - name: Save Cabal packages
        if: steps.cabal-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cabal-paths.outputs.packages }}
            ${{ steps.cabal-paths.outputs.store }}
          key: ${{ steps.cabal-cache.outputs.cache-primary-key }}

      - name: Show compiler and Make targets
        run: |
          agda-nightly --version
          make help

      - name: Build from clean interfaces
        run: |
          make clean
          make

      - name: Check explicit build targets
        run: |
          make build
          make build-set build-gpd

      - name: Verify cleanup
        run: |
          make clean
          test ! -e _build
          test ! -e MAlonzo
          test -z "$(find Bonak examples -type f -name '*.agdai' -print -quit)"
          git diff --exit-code
